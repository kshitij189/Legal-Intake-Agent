services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intake_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-legal_intake}
    ports:
      # Host port 5433: 5432 is commonly taken by a locally installed PostgreSQL.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Self-hosted LiveKit (WebRTC) for the voice loop. Dev mode = placeholder keys devkey/secret:
  # local development only, never exposed beyond this machine.
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"   # signalling (ws)
      - "127.0.0.1:7881:7881"   # WebRTC over TCP
      - "127.0.0.1:7882:7882/udp"  # WebRTC over UDP (single muxed port)

volumes:
  postgres_data:
